version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # one PR a week for the routine bumps; majors still arrive on their own
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "🔧 chore(deps)"
      prefix-development: "🔧 chore(deps-dev)"
