<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" role="img" aria-labelledby="t d">
<title id="t">PLANTESA system flow</title>
<desc id="d">Flowchart redrawn from the PLANTESA flowchart deck. Start. The Raspberry Pi 4 and ESP32 are connected to power, then the sensors and actuators are powered and connected to the ESP32. The flow then splits. System 2, the water loop: is the soil moist enough according to the moisture sensor? If no, the main water pump remains off. If yes, the water pump sends water to the soil, the water passes through the soil to the bottom of the pot and goes to the reservoir below the pot. If the water level sensor says the buffer reservoir is not full, the buffer water pump remains off; if it is full, the water is pumped back up to the main reservoir, and the flow ends. System 1, monitoring: the NPK sensor shows nutrient data, the SHT40 shows temperature and humidity, the LED is switched on and off manually through a relay, the ultrasonic sensor shows the water level and warns when it is low, and the Raspberry Pi 4 predicts when the main reservoir will run dry and runs a CNN on camera images to show leaf quality. All of it is sent to the Firebase database and website and shown to the client.</desc>
<style>
:root{--bg:#fffdf8;--fg:#1b1815;--mu:#6b645a;--ac:#b5461c;--bd:#ddd6c8;--s2:#ede8dd}
@media (prefers-color-scheme:dark){:root{--bg:#1e1b16;--fg:#ece6da;--mu:#a39b8d;--ac:#ee9a6c;--bd:#37322a;--s2:#26221c}}
text{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--fg);font-size:12px;text-anchor:middle}
.mu{fill:var(--mu)}.ac{fill:var(--ac)}.b{font-weight:600}.l{text-anchor:start}
.bg{fill:var(--bg)}
.box{fill:var(--s2);stroke:var(--mu);stroke-width:1.2}
.off{fill:var(--bg);stroke:var(--bd);stroke-width:1.2}
.dec{fill:var(--bg);stroke:var(--ac);stroke-width:1.8}
.term{fill:var(--bg);stroke:var(--fg);stroke-width:1.8}
.io{fill:var(--bg);stroke:var(--fg);stroke-width:1.4}
.ln{stroke:var(--fg);stroke-width:1.4;fill:none}
.dot{fill:var(--fg)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--fg)"/></marker>
</defs>
<rect class="bg" width="760" height="770" rx="8"/>

<!-- top row -->
<ellipse class="term" cx="70" cy="60" rx="46" ry="22"/><text x="70" y="64" class="b">Start</text>
<path class="ln" d="M116 60H146" marker-end="url(#a)"/>
<path class="io" d="M164 30H392L376 90H148Z"/>
<text x="270" y="56">Input: Raspberry Pi 4 and ESP32</text><text x="270" y="71">is connected to the Power</text>
<path class="ln" d="M386 60H436" marker-end="url(#a)"/>
<path class="io" d="M454 30H704L688 90H438Z"/>
<text x="571" y="56">Input: Sensors and Actuators are</text><text x="571" y="71">powered and connected to ESP32</text>

<!-- split -->
<path class="ln" d="M571 90V118H270V146" marker-end="url(#a)"/>
<circle class="dot" cx="420" cy="118" r="3"/>
<text x="280" y="140" class="l b ac">System 2</text>
<text x="428" y="140" class="l b ac">System 1</text>

<!-- System 2: water loop -->
<path class="dec" d="M270 150L385 200L270 250L155 200Z"/>
<text x="270" y="189">Is the Soil Moist</text><text x="270" y="204">Enough?</text><text x="270" y="219" class="mu">(Moisture Sensor)</text>
<path class="ln" d="M155 200H130" marker-end="url(#a)"/><text x="141" y="193" class="mu">No</text>
<rect class="off" x="6" y="177" width="120" height="46" rx="4"/><text x="66" y="196">Main Water Pump</text><text x="66" y="211">Remains Off</text>
<path class="ln" d="M270 250V272" marker-end="url(#a)"/><text x="280" y="267" class="l mu">Yes</text>
<rect class="box" x="155" y="276" width="230" height="46" rx="4"/><text x="270" y="295">Water Pump sends water</text><text x="270" y="310">to the Soil</text>
<path class="ln" d="M270 322V340" marker-end="url(#a)"/>
<rect class="box" x="155" y="344" width="230" height="58" rx="4"/><text x="270" y="362">Water Pass through the Soil</text><text x="270" y="377">until it reaches the bottom</text><text x="270" y="392">surface of the pot</text>
<path class="ln" d="M270 402V420" marker-end="url(#a)"/>
<rect class="box" x="155" y="424" width="230" height="46" rx="4"/><text x="270" y="443">The Water goes to the water</text><text x="270" y="458">reservoir below the pot</text>
<path class="ln" d="M270 470V488" marker-end="url(#a)"/>
<path class="dec" d="M270 492L388 556L270 620L152 556Z"/>
<text x="270" y="537">Is the Water Level</text><text x="270" y="552">in the Buffer</text><text x="270" y="567">Reservoir Full?</text><text x="270" y="582" class="mu">(Water Level Sensor)</text>
<path class="ln" d="M152 556H130" marker-end="url(#a)"/><text x="141" y="549" class="mu">No</text>
<rect class="off" x="6" y="533" width="120" height="46" rx="4"/><text x="66" y="552">Buffer Water Pump</text><text x="66" y="567">Remains Off</text>
<path class="ln" d="M270 620V640" marker-end="url(#a)"/><text x="280" y="635" class="l mu">Yes</text>
<rect class="box" x="155" y="644" width="230" height="46" rx="4"/><text x="270" y="663">Water is Pumped up back to</text><text x="270" y="678">the Main Reservoir</text>
<path class="ln" d="M270 690V708" marker-end="url(#a)"/>
<ellipse class="term" cx="270" cy="732" rx="46" ry="20"/><text x="270" y="736" class="b">End</text>

<!-- System 1: monitoring -->
<path class="ln" d="M420 118V450"/>
<path class="ln" d="M420 170H441" marker-end="url(#a)"/>
<path class="ln" d="M420 229H441" marker-end="url(#a)"/>
<path class="ln" d="M420 291H441" marker-end="url(#a)"/>
<path class="ln" d="M420 360H441" marker-end="url(#a)"/>
<path class="ln" d="M420 450H441" marker-end="url(#a)"/>
<rect class="box" x="445" y="150" width="260" height="40" rx="4"/><text x="575" y="174">Sensor NPK shows the Nutrients data</text>
<rect class="box" x="445" y="206" width="260" height="46" rx="4"/><text x="575" y="225">SHT40 shows the Temperature and</text><text x="575" y="240">Humidity Data</text>
<rect class="box" x="445" y="268" width="260" height="46" rx="4"/><text x="575" y="287">LED Manually ON &amp; OFF</text><text x="575" y="302">Controlled by Relay</text>
<rect class="box" x="445" y="330" width="260" height="60" rx="4"/><text x="575" y="349">Ultrasonic Sensor: Displays water</text><text x="575" y="364">level data and provides a warning</text><text x="575" y="379">when the level is low.</text>
<rect class="box" x="445" y="406" width="260" height="88" rx="4"/><text x="575" y="424" class="b">Raspberry Pi 4:</text><text x="575" y="439">- Predicts the depletion time of the</text><text x="575" y="454">main reservoir water.</text><text x="575" y="469">- CNN using camera shows the Leaf</text><text x="575" y="484">Quality Data</text>
<path class="ln" d="M705 170H728M705 229H728M705 291H728M705 360H728M705 450H728"/>
<path class="ln" d="M728 170V516H575V536" marker-end="url(#a)"/>
<rect class="box" x="445" y="540" width="260" height="46" rx="4"/><text x="575" y="559">Send data to Firebase' Database</text><text x="575" y="574">and Website</text>
<path class="ln" d="M575 586V608" marker-end="url(#a)"/>
<ellipse class="term" cx="575" cy="634" rx="72" ry="22"/><text x="575" y="638" class="b">Show to Client</text>
</svg>
